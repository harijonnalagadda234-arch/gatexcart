{% if image %}
<img src="{{ image.url }}" alt="{{ alt }}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
<span class="product-image-placeholder" role="img" aria-label="Product image unavailable: {{ alt }}" hidden>{{ alt }}</span>
{% else %}
<span class="product-image-placeholder" role="img" aria-label="Product image unavailable: {{ alt }}">{{ alt }}</span>
{% endif %}
